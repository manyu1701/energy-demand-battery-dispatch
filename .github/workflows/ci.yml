name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

      # The committed sample dataset and the dashboard artifacts are generated
      # output. Rebuilding them here proves the pipeline still runs end to end
      # and that what is checked in is reproducible from the code.
      - name: Verify the sample dataset is reproducible
        run: |
          python scripts/generate_sample_data.py
          git diff --exit-code -- data/sample/

      - name: Rebuild the dashboard artifacts
        run: python scripts/build_dashboard_data.py --fast

  frontend:
    name: Node dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend
